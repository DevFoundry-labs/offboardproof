name: Bug report
description: Report a reproducible defect using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include employee data, credentials, or undisclosed vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include synthetic inputs, observed behavior, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or evidence
