name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=offboardproof --cov-report=term-missing --cov-report=xml
      - run: pip-audit
      - run: detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.pytest-tmp)/' > secrets.json
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-coverage
          path: |
            dist/*
            coverage.xml
            secrets.json

  wheel-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions-and-coverage
          path: artifacts
      - run: python -m pip install artifacts/dist/*.whl
      - run: offboardproof demo --output-dir /tmp/offboardproof-demo
