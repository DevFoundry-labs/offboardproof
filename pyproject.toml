[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "offboardproof"
version = "0.2.0"
description = "Verification-first employee offboarding with approvals, recoverable actions, and audit evidence."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "DevFoundry Labs"}]
keywords = ["offboarding", "identity", "workflow", "audit", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "google-auth>=2.38,<3",
  "pydantic-settings>=2.7,<3",
  "requests>=2.32,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "detect-secrets>=1.5,<2",
  "httpx>=0.28,<1",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
offboardproof = "offboardproof.cli:app"

[project.urls]
Homepage = "https://github.com/DevFoundry-labs/offboardproof"
Repository = "https://github.com/DevFoundry-labs/offboardproof"
Issues = "https://github.com/DevFoundry-labs/offboardproof/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/offboardproof"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["offboardproof"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["offboardproof"]
omit = ["src/offboardproof/cli.py", "src/offboardproof/logging_config.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
